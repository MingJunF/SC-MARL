# MAPPO + hard (bang-bang) stealth-cost constraint ("standard method" baseline).
# Same mechanism as mappo_lagr.yaml (joint_adv = adv_r - lam*adv_c) but lambda is a
# fixed hard switch (lambda_max if mean_cost>eps_cost else 0) instead of a smoothly
# dual-ascended variable — no adaptation, no in-between penalty strength.
seed:
  seed_specify: True
  seed: 1
device:
  cuda: True
  cuda_deterministic: True
  torch_threads: 4
train:
  n_rollout_threads: 20
  num_env_steps: 10000000
  episode_length: 200
  log_interval: 5
  eval_interval: 25
  use_valuenorm: True
  use_linear_lr_decay: False
  use_proper_time_limits: True
  model_dir: ~
eval:
  use_eval: True
  n_eval_rollout_threads: 10
  eval_episodes: 20
render:
  use_render: False
  render_episodes: 10
model:
  hidden_sizes: [128, 128]
  activation_func: relu
  use_feature_normalization: True
  initialization_method: orthogonal_
  gain: 0.01
  use_naive_recurrent_policy: False
  use_recurrent_policy: False
  recurrent_n: 1
  data_chunk_length: 10
  lr: 0.0005
  critic_lr: 0.0005
  opti_eps: 0.00001
  weight_decay: 0
  std_x_coef: 1
  std_y_coef: 0.5
algo:
  ppo_epoch: 5
  critic_epoch: 5
  use_clipped_value_loss: True
  clip_param: 0.2
  actor_num_mini_batch: 1
  critic_num_mini_batch: 1
  entropy_coef: 0.01
  value_loss_coef: 1
  use_max_grad_norm: True
  max_grad_norm: 10.0
  use_gae: True
  gamma: 0.99
  gae_lambda: 0.95
  use_huber_loss: True
  use_policy_active_masks: True
  huber_delta: 10.0
  action_aggregation: mean
  share_param: False
  fixed_order: True
  # --- stealth-cost constraint (hard bang-bang variant) ---
  constraint_mode: hard
  # see mappo_lagr.yaml: calibrated against the clean/honest baseline (mean~0.84, p90~1.98).
  eps_cost: 1.0
  # see mappo_lagr.yaml: dense per-step cost, match gamma instead of undiscounting.
  gamma_c: 0.99
  # unused in hard mode (kept for symmetry with mappo_lagr.yaml).
  alpha_lambda: 0.05
  lambda_max: 20.0
  lambda_init: 0.0
  # --- TrajectoryCritic (only used when env_args.stealth_source == "traj_critic") ---
  traj_hidden: 128
  traj_lr: 0.001
  traj_epoch: 4
  n_clean_ref: 64
logger:
  log_dir: "./results"
